id = "yii2.support"
name = "Yii2 Support"
version = "0.1.6"
description = "Yii 2 Framework support for OpenIDEA: views + passed variables, routes, i18n, AR/forms, aliases, components, assets, console, migrations, behaviors, widgets, ActiveForm JS."
authors = ["Port of nvlad/yii2support"]
license = "MIT"
homepage = "https://github.com/nvlad/yii2support"
change-notes = "0.1.6 — view variables from render(); perf (Arc caches, scan caps, exclusive completion); components (Yii::$app-> / get / members); crash-safe indexing (no Instant/abort, capped scans); Yii2 JS ActiveForm/validation/gridView/pjax; aliases, components, assets (go-to js/css), console commands, migrations, behaviors, widgets; Yii2 JS ActiveForm completion. 0.1.5 — route params. 0.1.4 — parameterized routes."
categories = ["frameworks"]
engines.openidea = "^1.0"
wasm = "dist/plugin.wasm"
activation = ["on-language:php", "on-language:javascript", "on-language:typescript", "on-command:*"]

[capabilities]
required = ["project.read", "editor.read", "editor.write"]

[[contributes.providers]]
kinds = ["completion", "definition", "code-actions"]
languages = ["php"]

[[contributes.providers]]
kinds = ["completion"]
languages = ["javascript", "typescript"]

[[contributes.commands]]
id = "create-view"
title = "Yii2: Create View from render()"
category = "Yii2"
when = "editorFocus && editorLangId == php"

[[contributes.commands]]
id = "go-to-view"
title = "Yii2: Go to View"
category = "Yii2"
when = "editorFocus && editorLangId == php"

[[contributes.commands]]
id = "go-to-route"
title = "Yii2: Go to Route Controller"
category = "Yii2"
when = "editorFocus && editorLangId == php"

[[contributes.settings]]
schema = "settings.json"
title = "Yii2 Support"
