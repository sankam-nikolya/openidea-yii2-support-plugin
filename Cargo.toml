[package]
name = "openidea-plugin-yii2-support"
version = "0.1.7"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.37" }
lazy_static = "1.4"
# Performance optimizations
ahash = { version = "0.8", features = ["compile-time-rng"] }  # Faster hashing for HashMap/HashSet
parking_lot = "0.12"  # Faster locking primitives

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
# panic = "abort"  # avoid killing wasm instance on bug
